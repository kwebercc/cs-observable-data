# .github/workflows/update-data.yml
name: Update data

on:
  schedule:
    - cron: "0 9 * * *"   # 09:00 UTC daily
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write         # required for the bot to push

# Queue overlapping runs instead of letting them race to push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the rebase below works cleanly

      - name: Fetch and validate sources
        run: node scripts/fetch-data.mjs

      # Runs even if a source failed, so the manifest records the failure.
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: $(date -u +%Y-%m-%d)"

          # The remote may have moved since checkout. Rebase onto it and retry
          # rather than failing the run over a race.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      # Turn the run red so you get GitHub's failure email.
      - name: Report failures
        run: |
          if grep -q '"status": "failed"' data/manifest.json; then
            echo "::error::One or more sources failed — see data/manifest.json"
            exit 1
          fi
