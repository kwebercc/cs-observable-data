# .github/workflows/update-data.yml
name: Update data

on:
  schedule:
    # Twice daily. Climate Reanalyzer publishes its OISST update partway
    # through the day, so a single morning run always trails it by one day.
    # The evening pass catches it; unchanged sources are no-ops either way.
    - cron: "0 9 * * *"
    - cron: "0 22 * * *"
  workflow_dispatch:      # lets you run it by hand from the Actions tab

permissions:
  contents: write         # required for the bot to push

# Queue overlapping runs instead of letting them race to push.
concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15    # a hung fetch shouldn't hold the lock for 6 hours
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # full history so the rebase below works cleanly

      - name: Fetch and validate sources
        run: node scripts/fetch-data.mjs

      # Runs even if a source failed, so the manifest records the failure.
      - name: Commit
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/

          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "data: $(date -u +%Y-%m-%d)"

          # The remote may have moved since checkout. Rebase onto it and retry
          # rather than failing the run over a race.
          for attempt in 1 2 3; do
            if git pull --rebase --autostash origin "${GITHUB_REF_NAME}" && git push; then
              echo "Pushed on attempt ${attempt}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; retrying."
            sleep 5
          done

          echo "::error::Could not push after 3 attempts."
          exit 1

      # Turn the run red only once a source is past its grace period, so a
      # one-day upstream outage doesn't train you to ignore the emails.
      - name: Report failures
        run: |
          if grep -q '"alert": true' data/manifest.json; then
            echo "::error::A source has been failing past the grace period — see data/manifest.json"
            exit 1
          fi
          if grep -q '"status": "failed"' data/manifest.json; then
            echo "::warning::One or more sources failed today (within grace period)."
          fi
